name: playground

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/playground.yml'
  workflow_dispatch:

concurrency:
  group: playground
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: playground
      url: ${{ vars.PLAYGROUND_SITE_URL }}
    env:
      NUXT_PUBLIC_CONVEX_URL: ${{ vars.PLAYGROUND_CONVEX_URL }}
      NUXT_PUBLIC_CONVEX_SITE_URL: ${{ vars.PLAYGROUND_CONVEX_SITE_URL }}
      NUXT_PUBLIC_SITE_URL: ${{ vars.PLAYGROUND_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm

      # Convex first, so the new worker never talks to old functions
      - name: Deploy Convex functions
        working-directory: playground
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.PLAYGROUND_CONVEX_DEPLOY_KEY }}
        run: pnpm exec convex deploy

      - name: Build
        run: pnpm --dir playground build

      - name: Deploy worker
        working-directory: playground
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PLAYGROUND_CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy --config .output/server/wrangler.json
          --var "NUXT_PUBLIC_CONVEX_URL:$NUXT_PUBLIC_CONVEX_URL"
          --var "NUXT_PUBLIC_CONVEX_SITE_URL:$NUXT_PUBLIC_CONVEX_SITE_URL"
          --var "NUXT_PUBLIC_SITE_URL:$NUXT_PUBLIC_SITE_URL"

      - name: Smoke test
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "$NUXT_PUBLIC_SITE_URL/")
          echo "GET / -> $status"
          test "$status" = 200
          status=$(curl -s -o /dev/null -w '%{http_code}' "$NUXT_PUBLIC_SITE_URL/api/tasks/stats")
          echo "GET /api/tasks/stats (anonymous) -> $status"
          test "$status" = 401
