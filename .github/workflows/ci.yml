name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml and pkg.yml reuse these checks
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.number || inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint
      # The Nuxt module imports vue-convex's built output, so build before anything type-aware.
      - run: pnpm build
      - run: pnpm typecheck
      # Reads packages/*/dist, so it runs after the build
      - run: pnpm check:doctor
      - run: pnpm test
      - run: pnpm validate:packages

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm docs:build
