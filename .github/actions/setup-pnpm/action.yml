name: setup-pnpm
description: Enable corepack, set up Node.js with the pnpm cache, and install dependencies

inputs:
  install-command:
    description: Command used to install dependencies
    required: false
    default: pnpm install --frozen-lockfile

runs:
  using: composite
  steps:
    - shell: bash
      run: corepack enable

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - shell: bash
      run: ${{ inputs.install-command }}
