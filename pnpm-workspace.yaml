minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@nuxtjs/better-auth@0.3.12'
  - vite@8.3.5

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - semver

# @convex-dev/better-auth (<= 0.12.5) needs better-auth <1.7: it imports
# better-auth/plugins/oidc-provider, which 1.7 removed. @nuxtjs/better-auth asks for >=1.7,
# but its client-only mode works with 1.6. Drop this once 1.7 support ships:
# https://github.com/get-convex/better-auth/pull/444
peerDependencyRules:
  allowedVersions:
    '@nuxtjs/better-auth>better-auth': 1.6.33

shellEmulator: true

packages:
  - packages/*
  - playground
  - docs
  - examples/*

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': false
  '@prisma/engines': false
  better-sqlite3: true
  esbuild: true
  prisma: false
  sharp: true
  unrs-resolver: false
  vue-demi: false

  workerd: true

catalog:
  '@fontsource-variable/inter': ^5.3.0
  '@fontsource-variable/jetbrains-mono': ^5.3.0
  '@nuxt/content': ^3.16.2
  '@nuxt/fonts': ^1.0.1
  '@nuxt/ui': ^4.12.0
  '@vercel/analytics': ^2.0.1
  '@vercel/speed-insights': ^2.0.0
  '@vueuse/core': ^15.0.0
  bumpp: ^12.3.0
  docus: ^5.15.0
  nuxt: ^4.6.2
  ofetch: ^1.5.1
  playwright-core: ^1.64.1
  tailwindcss: ^4.3.3
  ufo: ^1.6.4
  yaml: ^2.9.1
  zod: ^4.6.7
  zod-to-json-schema: ^3.25.2

catalogs:
  build:
    '@nuxt/module-builder': ^1.0.3
    publint: ^0.3.25
    tsdown: ^0.23.1
    typescript: ^6.0.3
  convex:
    '@convex-dev/better-auth': ^0.12.5
    '@convex-dev/r2': ^0.10.4
    convex: ^1.47.0
  lint:
    '@antfu/eslint-config': ^9.5.1
    '@nuxt/eslint-config': ^1.17.0
    eslint: ^10.13.0
    eslint-plugin-format: ^2.0.1
    vite-doctor: ^0.1.0
  nuxt:
    '@nuxt/devtools': 4.0.0-beta.7
    '@nuxt/devtools-kit': 4.0.0-beta.7
    vue: ^3.5.44
  playground:
    '@nuxthub/core': ^0.10.10
    '@nuxtjs/better-auth': ^0.3.12
    better-auth: 1.6.33
    wrangler: ^4.151.3
  prod:
    '@nuxt/kit': ^4.6.2
    consola: ^3.4.2
    defu: ^6.1.7
    pathe: ^2.0.3
  test:
    '@nuxt/test-utils': ^4.3.4
    '@vue/test-utils': ^2.5.1
    jsdom: ^30.1.3
    vitest: ^5.0.5
    vitest-package-exports: ^1.2.0
  types:
    '@types/node': ^24.13.3

  vite:
    '@vitejs/plugin-vue': ^6.0.10
    vite: ^8.3.5
